name: configuration-matrix

on: 
  workflow_dispatch:
  push:

jobs:
    deploy-on-ubuntu:
        runs-on: ubuntu-latest
        steps:
            - name: echo docker details
              run: docker info

            - name: echo docker hello world
              run: docker run hello-world

    deploy-on-windows:
        runs-on: windows-latest
        steps:
            - name: echo docker details
              run: docker info

            - name: echo docker hello world
              run: docker run hello-world