name: First Example

on: push

jobs:
     first-job:
       runs-on: ubuntu-latest
       steps:
        - name: checkout code
          uses: actions/checkout@v3
        
        - name: welcome message
          run: echo "Hello World!"

        - name: list files
          run: ls -la

        - name: show current directory
          run: pwd

        - name: Readme file content
          run: cat README.md